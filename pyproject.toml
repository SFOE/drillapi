[project]
name = "drillapi"
version = "0.1.12"
description = "drillapi"
authors = [{name = "SFOE", email = "geoinformation@bfe.admin.ch"}]
readme = "README.md"
requires-python = ">=3.14"
keywords = ["drillapi"]
dependencies = [
  "fastapi>=0.142.2",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "mangum>=0.22.0",
  "owslib>=0.36.0",
  "pydantic-settings>=2.15.0",
  "pyyaml>=6.0.3",
  "slowapi>=0.1.10",
  "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pygments>=2.21.0",
  "requests",
  "respx",
  "pytest-asyncio",
  "ruff>=0.16.10",
  "watchfiles>=1.3.0",
]

[tool.coverage.run]
omit = [
  "src/drillapi/__main__.py",
  "src/drillapi/lambda_handler.py",
]

[project.scripts]
drillapi = "drillapi.__main__:main"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"
