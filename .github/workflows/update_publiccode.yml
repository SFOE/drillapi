name: Sync version on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-publiccode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync version into publiccode.yml and pyproject.toml
        run: |
          # Release tag, e.g. v0.2.7. publiccode.yml keeps the "v" prefix;
          # pyproject.toml version must be PEP 440 (no "v"), so strip it there.
          VERSION="${{ github.event.release.tag_name }}"
          PEP440_VERSION="${VERSION#v}"
          DATE=$(date +%Y-%m-%d)

          sed -i "s/^softwareVersion:.*/softwareVersion: ${VERSION}/" publiccode.yml
          sed -i "s/^releaseDate:.*/releaseDate: ${DATE}/" publiccode.yml

          # Update only the [project] version line (the first `version = "..."`),
          # not dependency version constraints further down the file.
          sed -i "0,/^version = \".*\"/s//version = \"${PEP440_VERSION}\"/" pyproject.toml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publiccode.yml pyproject.toml
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync version to ${{ github.event.release.tag_name }}"
          git push
