  # Zone F ("Ausserhalb nutzbarer Grundwasservorkommen" / outside usable
  # groundwater deposits) has no documented ground_control_point and no
  # discrete live bbox could be recorded for it: live probing of coordinates
  # away from Zones A-E returns an empty feature list (no gml:Box at all),
  # confirming that "outside every mapped zone" is represented by the absence
  # of a feature rather than by a distinct Zone F polygon. No bbox_zones
  # entry is added for it; such points correctly fall through to UNKNOWN(4)
  # via the no-match case, which matches the documented edge case in
  # design.md ("a coordinate that resolves to ZH but falls outside every
  # mapped zone bbox should still resolve to UNKNOWN(4)").
