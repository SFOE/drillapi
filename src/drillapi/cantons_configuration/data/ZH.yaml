  # Marked queryable="0" by the live server's GetCapabilities; GetFeatureInfo
  # against it is always rejected (LayerNotDefined / "not offered by the
  # service instance"). Kept in LAYERS so the request shape still matches the
  # real service, but excluded from QUERY_LAYERS. See design.md for details.
  queryable: false
# The server only publishes a single combined, queryable zone layer. Its
# GetFeatureInfo response carries no attribute payload (no gml:name, no zone
# label) — only a gml:boundedBy/gml:Box bounding box per feature. Zone
# identity is therefore resolved via a static bbox->zone lookup table
# (bbox_zones), recorded by querying this layer live at each zone's
# documented ground_control_point (see design.md "Investigation Findings").
- name: waermenutzung-zonen
  property_name: name
  bbox_zones:
